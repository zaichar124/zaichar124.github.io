<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6cf6">
<title>ЕС Зайчар 124 · Анкети</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --ink2:#334155; --mute:#64748b; --line:#e6eaf2;
  --pri:#3b6cf6; --pri2:#6d5dfc; --pri-soft:#eef2ff; --ok:#16a34a; --ok-soft:#e8f7ee; --bad:#e5484d; --bad-soft:#fdeeee;
  --warn:#f59e0b; --r:18px; --sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--pri)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 96px}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.82);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid rgba(230,234,242,.7)}
.top .in{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto;border:0;background:none;padding:0;text-align:left}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;box-shadow:0 6px 16px rgba(59,108,246,.35)}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand span{font-size:12px;color:var(--mute)}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .08s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 20px rgba(59,108,246,.3)}
.btn.pri:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:#cfd6e4}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.icon{padding:8px;border-radius:12px}
/* demo banner */
.demo{background:linear-gradient(90deg,#fff7e6,#fff1f2);border:1px solid #fde3b0;color:#92400e;border-radius:14px;padding:10px 14px;font-size:13px;margin:16px 0 0;display:flex;gap:10px;align-items:flex-start}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-top:16px}
.hero{position:relative;overflow:hidden;padding:24px}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(109,93,252,.16),transparent 70%)}
h1{font-size:26px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 4px}
.muted{color:var(--mute)}
.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pri-soft);color:#3346b8;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:#13803d}.chip.bad{background:var(--bad-soft);color:#c53035}.chip.gray{background:#f1f5f9;color:var(--mute)}
.problem{white-space:pre-wrap;color:var(--ink2);margin-top:10px}
.sec-t{display:flex;align-items:center;gap:10px;margin:28px 4px 0;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.sec-t .n{width:24px;height:24px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
/* objects grid */
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:14px}
.obj{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;text-align:left;cursor:pointer;transition:all .15s}
.obj b{display:block;font-size:14px}
.obj small{color:var(--mute);font-size:12px}
.obj:hover{border-color:#b9c6f7}
.obj.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px rgba(59,108,246,.15)}
.obj.done{background:#f3f4f6;border-color:#eceef2;color:#9ca3af;cursor:not-allowed;filter:grayscale(1)}
.obj.done b{color:#9ca3af}
/* questions */
.q{padding:22px}
.q-h{display:flex;gap:12px;align-items:flex-start}
.q-num{flex:none;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.q-text{font-weight:700;font-size:16.5px;white-space:pre-wrap}
.media{margin-top:14px;border-radius:14px;overflow:hidden;background:#0f172a0d}
.media img,.media video{display:block;width:100%;max-height:440px;object-fit:contain;background:#0b1220}
.media iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#0b1220}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;background:#fff;transition:all .15s;text-align:left;width:100%}
.opt:hover{border-color:#b9c6f7}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;transition:all .15s}
.opt.on{border-color:var(--c,var(--pri));background:color-mix(in srgb,var(--c,var(--pri)) 8%,#fff)}
.opt.on .dot{border-color:var(--c,var(--pri));background:var(--c,var(--pri))}
.opt.on .dot:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt span{font-weight:600}
.opt[disabled]{cursor:not-allowed;opacity:.6}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,108,246,.15)}
textarea.inp{min-height:84px;resize:vertical}
/* sticky submit */
.bar-submit{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-submit .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-submit .info{margin-right:auto;font-size:13px;color:var(--mute);line-height:1.3}
.bar-submit .info b{color:var(--ink)}
/* results */
.meter{position:relative;height:14px;border-radius:999px;background:#eef2f7;overflow:visible;margin:14px 0 8px}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--pri),var(--pri2));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meter>i.ok{background:linear-gradient(90deg,#22c55e,#16a34a)}
.qline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:2px}
.qline:after{content:attr(data-l);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.chart{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px}
.chart-t{font-weight:800;font-size:13px}
.chart-t small{display:block;font-weight:600;color:var(--mute);font-size:11.5px}
.brow{margin-top:12px}
.brow .l{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.brow .l b{font-variant-numeric:tabular-nums}
.track{position:relative;height:12px;border-radius:999px;background:#e9edf5;margin-top:5px}
.track>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.track .qm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.brow .s{font-size:11.5px;color:var(--mute);margin-top:3px}
.legend{font-size:11.5px;color:var(--mute);margin-top:10px;display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:2px;height:12px;background:var(--ink);opacity:.55}
/* thanks */
.thanks{text-align:center;padding:40px 22px}
.check{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:grid;place-items:center;box-shadow:0 14px 30px rgba(22,163,74,.35);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.check svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.thanks h1{font-size:30px}
/* lists */
.srow{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:10px;cursor:pointer;transition:all .15s;width:100%;text-align:left}
.srow:hover{border-color:#b9c6f7;transform:translateY(-1px);box-shadow:var(--sh)}
.srow .t{font-weight:800}
.srow .grow{flex:1;min-width:0}
.mini{height:6px;border-radius:999px;background:#eef2f7;margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
/* admin */
.tabs{display:flex;gap:6px;background:#e9edf5;padding:4px;border-radius:999px;width:max-content;margin-top:18px}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}
.aq{border:1px dashed #cdd5e3;border-radius:16px;padding:16px;margin-top:14px;background:#fbfcfe}
.aq-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.aopt{display:flex;gap:8px;margin-top:8px}
.aopt .inp{padding:9px 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.tbl tr.no td{color:#9ca3af}
.tbl .inp{padding:7px 9px;border-radius:10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:14px;font-weight:600;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--pri)}
/* toast + modal */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal .box{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
@keyframes fade{from{opacity:0}}
.spin{width:28px;height:28px;border:3px solid #dbe3f3;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.fade-in{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media (max-width:640px){
  h1{font-size:22px}.thanks h1{font-size:25px}
  .charts{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}
  .card,.q{padding:16px}.hero{padding:18px}
  .top .hide-sm{display:none}
  .objs{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:380px){.objs{grid-template-columns:repeat(2,1fr)}}

/* ---- v01 ---- */
.opt.multi .dot{border-radius:7px}
.opt.multi.on .dot:after{content:"✓";width:auto;height:auto;background:none;color:#fff;font-size:13px;font-weight:800;line-height:1}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px}
.me{display:flex;align-items:center;gap:14px}
.me .big{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.codebox{margin-top:14px;padding:14px;border-radius:14px;background:var(--pri-soft)}
.codebox .inp{text-transform:uppercase;letter-spacing:.2em;font-weight:800;max-width:220px}
.proxy{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13.5px}
.obj .px{display:block;font-size:10.5px;color:#b45309;margin-top:2px}
.dec{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;margin-top:12px}
.dec.ok{background:var(--ok-soft);color:#13803d}.dec.no{background:var(--bad-soft);color:#c53035}.dec.wait{background:#f1f5f9;color:var(--mute)}
.texts{margin-top:12px;display:grid;gap:8px}
.texts div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.texts small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:2px}
.dd{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;outline:none;max-width:100%}
.dd:focus{border-color:var(--pri)}
.prow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.prow .dd{flex:1;min-width:130px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.12em}
.linkcell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--mute)}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:700}
.drop{border:2px dashed #c7d2fe;border-radius:16px;padding:26px;text-align:center;background:#f8faff;cursor:pointer;display:block}
.drop:hover{background:#eef2ff}
.imp-o{display:inline-flex;gap:6px;align-items:center;background:#f1f5f9;border-radius:999px;padding:4px 10px;font-size:12.5px;margin:6px 6px 0 0}
.warnrow td{background:#fff7ed}
.frame{width:100%;height:70vh;border:0;background:#fff}
.anon{background:#f5f3ff;color:#6d28d9}

.files{display:grid;gap:8px;margin-top:12px}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.ficon{flex:none;width:40px;height:46px;border-radius:8px;background:linear-gradient(160deg,#ef4444,#b91c1c);color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;letter-spacing:.04em}
.fmeta{flex:1;min-width:0}
.fmeta b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta small{color:var(--mute);font-size:12px}
.fbtns{display:flex;gap:8px;flex:none}
@media (max-width:640px){.file{flex-wrap:wrap}.fbtns{width:100%}.fbtns .btn{flex:1;justify-content:center}}

</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="brand" data-act="home" aria-label="Начало">
    <span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="m9 14 2 2 4-4"/></svg></span>
    <span><b>ЕС Зайчар 124</b><span>Анкети · v01</span></span>
  </button>
  <button class="btn ghost sm" data-act="home">Анкети</button>
  <button class="btn ghost sm" data-act="admin" title="За домоуправителя">⚙<span class="hide-sm"> Админ</span></button>
</div></header>
<main class="wrap" id="app"><div class="spin"></div></main>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ЕС Зайчар 124 · Анкети · v01 – ОБЩ КОД
   Ползва се от сървъра (Code.gs) и от страницата (демо режим).
   SHARED – помощни функции; CORE(store) – цялата бизнес логика.
   ===================================================================== */
var SHARED = (function () {
  var PALETTE = ['#3b6cf6', '#8b5cf6', '#f59e0b', '#06b6d4', '#ec4899', '#14b8a6', '#f97316'];
  var YES_RE = /^(да|за|yes|съгласен|съгласна|съгласни)([\s.,!]|$)/;
  var NO_RE = /^(не|против|no|несъгласен|несъгласна)([\s.,!]|$)/;
  var MAJORITY = {
    none: { label: 'Без решение (само мнение)' },
    repr50: { label: 'Над 50% от представените ид. части', short: '>50% от представените' },
    all51: { label: 'Поне 51% от всички ид. части', short: '≥51% от всички', min: 51 },
    all67: { label: 'Поне 67% от всички ид. части', short: '≥67% от всички', min: 67 },
    all75: { label: 'Поне 75% от всички ид. части', short: '≥75% от всички', min: 75 },
    all100: { label: '100% от всички ид. части', short: '100% от всички', min: 100 }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtPct(n, d) {
    var p = Math.pow(10, d == null ? 1 : d);
    return String(Math.round((n || 0) * p) / p).replace('.', ',') + '%';
  }
  function optColor(text, i) {
    var t = String(text || '').trim().toLowerCase();
    if (YES_RE.test(t)) return '#16a34a';
    if (NO_RE.test(t)) return '#e5484d';
    if (/въздърж/.test(t)) return '#94a3b8';
    return PALETTE[i % PALETTE.length];
  }
  function uid(n) {
    var c = 'abcdefghijkmnopqrstuvwxyz23456789', s = '';
    for (var i = 0; i < (n || 8); i++) s += c.charAt(Math.floor(Math.random() * c.length));
    return s;
  }
  function code6() {
    var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 6; i++) s += c.charAt(Math.floor(Math.random() * c.length));
    return s;
  }
  /* „Апартамент 03“, „Ап.3“, „AP03“ → „АП3“; „Гараж 02“, „Га.02“ → „Г2“; „ПМ 08“ → „ПМ8“ */
  function objKey(text) {
    var t = String(text || '').toUpperCase().replace(/[\s._\-№#]+/g, '');
    t = t.replace(/^AP/, 'АП').replace(/^PM/, 'ПМ').replace(/^G(?=\d)/, 'Г');
    var m = t.match(/^(АПАРТАМЕНТ|АПАРТ|АП|ГАРАЖ|ГА|Г|ПАРКОМЯСТО|ПМ|МАГАЗИН|МАГ|АТЕЛИЕ|ОФИС)(\d+)/);
    if (!m) return t;
    var k = m[1];

      '<div style="background:#f4f7fd;border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:14px">Гласували: <b>' + r.votedObjects + ' от ' + r.totalObjects + '</b> обекта · <b>' + S.fmtPct(r.votedPartsPct, 2) + '</b> ид. части · кворум: <b style="color:' + (r.quorumMet ? '#16a34a">има' : '#e5484d">няма') + '</b></div>' +
      r.questions.filter(function (q) { return q.decision; }).map(function (q) {
        return '<div style="margin:6px 0;font-size:14px">' + S.esc(q.text.length > 120 ? q.text.slice(0, 120) + '…' : q.text) + ' – <b style="color:' + (q.decision.passed ? '#16a34a">ПРИЕТО' : '#e5484d">НЕ Е ПРИЕТО') + '</b></div>';
      }).join('') + '<p style="margin-top:14px">Пълният протокол е в прикачения PDF файл.</p>';
    var html = '<div style="font-family:Arial,Helvetica,sans-serif;color:#1e293b;max-width:600px;margin:0 auto"><div style="background:#3b6cf6;color:#fff;border-radius:16px 16px 0 0;padding:22px 24px"><div style="font-size:13px;opacity:.85">' + S.esc(APP) +
      '</div><div style="font-size:21px;font-weight:bold;margin-top:4px">Протокол от анкета</div><div style="font-size:14px;margin-top:6px">' + S.esc(d.s.title) + '</div></div><div style="border:1px solid #e2e8f0;border-top:0;border-radius:0 0 16px 16px;padding:22px 24px">' + body + '</div></div>';
    var n = store.sendMail({ to: [], bcc: to, subject: 'Протокол: ' + d.s.title, html: html, text: 'Протокол от анкетата „' + d.s.title + '“ – в прикачения PDF файл.',
      attachments: pdf ? [{ name: d.name, base64: pdf.base64, blob: pdf.blob }] : [] });
    if (!n) throw new Error('Имейлът не беше изпратен (лимит или грешка в Gmail).');
    return { objects: objsSent, emails: to.length, quota: store.quota() };
  };
  api.adminImportSurvey = function (key, survey, votes) {
    checkAdmin(key);
    survey.imported = true;
    if (!survey.status || survey.status === 'draft') survey.status = 'closed';
    var s = S.normalizeSurvey(survey);
    s.questions.forEach(function (q, i) { if (q.type !== 'text' && q.options.length < 1) throw new Error('Въпрос ' + (i + 1) + ' няма отговори.'); });
    var objs = store.getObjects(), ids = {}, list = [];
    (votes || []).forEach(function (v) {
      var o = objs.filter(function (x) { return x.id === v.objectId; })[0];
      if (!o) return;
      var ans = {};
      s.questions.forEach(function (q) {
        var a = v.answers ? v.answers[q.id] : null;
        if (q.type === 'text') { if (a) ans[q.id] = String(a).slice(0, 2000); }
        else if (q.type === 'multi') ans[q.id] = (Array.isArray(a) ? a : []).filter(function (x) { return q.options.some(function (op) { return op.id === x; }); });
        else if (q.options.some(function (op) { return op.id === a; })) ans[q.id] = a;
      });
      ids[o.id] = { id: S.uid(10), surveyId: s.id, objectId: o.id, objectName: o.name, answers: ans, name: String(v.name || '').slice(0, 120),
        token: store.newToken(), createdAt: Number(v.createdAt) || Date.now(), updatedAt: 0, proxyBy: '' };
    });
    Object.keys(ids).forEach(function (k) { list.push(ids[k]); });
    list.sort(function (a, b) { return a.createdAt - b.createdAt; });
    store.lock(function () {
      if (store.getSurveys().some(function (x) { return x.id === s.id; })) throw new Error('Анкета с такова ID вече има.');
      store.saveSurvey(s);
      if (list.length) store.addVotes(list, s);
    });
    var r = S.calcResults(s, store.getVotes(s.id), objs);
    return { survey: s, votes: list.length, votedPartsPct: r.votedPartsPct, quorumMet: r.quorumMet };
  };
  return api;
}

function uploadMedia(input) {
  var f = input.files && input.files[0]; if (!f) return;

  if (target !== 'media' && !/pdf/i.test(f.type) && !/\.pdf$/i.test(f.name)) return toast('Изберете PDF файл.', true);
  if (f.size > 15 * 1024 * 1024) return toast(target === 'media' ? 'Файлът е над 15 MB. Качете клипа в YouTube и добавете линк.' : 'PDF файлът е над 15 MB.', true);
  collectDraft(); toast('Качване…');
  var rd = new FileReader();
  rd.onload = function () {
    API.adminUploadMedia(UI.key, { name: f.name, mime: f.type || (/\.pdf$/i.test(f.name) ? 'application/pdf' : 'application/octet-stream'), data: String(rd.result).split(',')[1], localUrl: API.demo ? URL.createObjectURL(f) : undefined })
      .then(function (m) {
        if (target === 'media') UI.draft.questions[i].media = m;
        else { var o = { name: f.name, url: m.url, preview: m.preview || '', fileId: m.fileId || '', size: m.size || f.size };

        renderEditor(); toast('Качено ✓');

  };
  rd.readAsDataURL(f);
}

  if (t.matches('input[type=file][data-act="upload"]')) uploadMedia(t);
  if (t.id === 'impfile' && t.files[0]) handleImportFile(t.files[0]);
  if (t.matches('select[data-act="qtype"]')) { collectDraft(); var q = UI.draft.questions[Number(t.getAttribute('data-i'))]; if (q.type !== 'text' && q.options.length < 2) q.options = [{ id: SHARED.uid(6), text: 'ДА' }, { id: SHARED.uid(6), text: 'НЕ' }]; if (q.type === 'text') q.majority = 'none'; renderEditor(); }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-text') && UI.sel) { UI.sel.answers[t.getAttribute('data-text')] = t.value; refreshSubmit(); }
  if (t.id === 'vcode' && UI.sel) { UI.sel.code = t.value.trim().toUpperCase(); refreshSubmit(); }
});

/* ================= Старт ================= */
function parseQuery(q) {
  var o = {}; String(q || '').replace(/^[?#]/, '').split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); o[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
  return o;
}
function route(p) {
  if (p.k) saveCode(String(p.k).trim().toUpperCase());
  if (p.edit) return viewSurvey(null, p.edit);
  if (p.admin !== undefined) return viewAdmin();
  var go = function () { if (p.s) viewSurvey(p.s); else viewHome(); };
  if (UI.code && !UI.me) API.apiResolveCode(UI.code).then(function (o) { UI.me = o; go(); }, function () { saveCode(null); go(); });
  else go();
}
UI.code = loadCode();
if (IS_GAS && google.script.url) google.script.url.getLocation(function (loc) { route(loc.parameter || {}); });
else {
  var q = parseQuery(location.search);
  if (location.hash === '#admin') q.admin = '';
  route(q);
  if (location.search && history.replaceState) try { history.replaceState(null, '', location.pathname + (q.s ? '?s=' + encodeURIComponent(q.s) : '')); } catch (e) {}
}
})();
</script>
